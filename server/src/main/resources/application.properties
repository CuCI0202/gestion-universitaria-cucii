spring.application.name=platform

# ── Datasource ───────────────────────────────────────────────────────────────
# Defaults apuntan al PostgreSQL local de desarrollo. En producción se
# sobreescriben con variables de entorno (ver application-prod.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ss-platform}
spring.datasource.username=${DB_USER:ssant0}
spring.datasource.password=${DB_PASSWORD:2004}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JWT ──────────────────────────────────────────────────────────────────────
# En producción SIEMPRE definir JWT_SECRET por variable de entorno.
# Expiración por defecto: 24 horas (86400000 ms).
security.jwt.secret=${JWT_SECRET:cucii-platform-super-secret-key-change-in-production-2024}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Lista separada por comas de orígenes permitidos.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
