# Perfil de producción. Requiere variables de entorno; no usa defaults de dev.
# Activar con SPRING_PROFILES_ACTIVE=prod

# ── Datasource (obligatorio) ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ── JWT (obligatorio) ────────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS (obligatorio) ───────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS}

# ── Detrás de reverse proxy (HTTPS terminado en nginx/Caddy) ─────────────────
server.forward-headers-strategy=framework

# ── DevTools deshabilitado ───────────────────────────────────────────────────
spring.devtools.restart.enabled=false
