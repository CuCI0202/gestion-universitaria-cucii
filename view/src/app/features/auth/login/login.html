<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-8">
      <div class="text-center mb-8">
        <img
          src="/images/logo/cucii-logo.png"
          alt="Logo CUCII"
          class="inline-block w-20 h-20 object-contain mb-4"
        />
        <h1 class="text-2xl font-bold text-brand-dark">Acceso al Sistema</h1>
        <p class="text-gray-500 text-sm mt-1">Ingresa tus credenciales para continuar</p>
      </div>

      @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm mb-5">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input
            formControlName="email"
            type="email"
            placeholder="profesor&#64;cucii.edu.mx"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
          />
          <p class="text-red-500 text-xs mt-1" [class.invisible]="!(form.controls.email.touched && form.controls.email.errors)">
            @if (form.controls.email.errors?.['required']) { El correo es obligatorio. }
            @else if (form.controls.email.errors?.['email']) { Ingresa un correo válido. }
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input
            formControlName="password"
            type="password"
            placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            [class.border-red-400]="form.controls.password.invalid && form.controls.password.touched"
          />
          <p class="text-red-500 text-xs mt-1" [class.invisible]="!(form.controls.password.touched && form.controls.password.errors?.['required'])">La contraseña es obligatoria.</p>
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary-dark disabled:opacity-60 disabled:cursor-not-allowed transition-colors mt-2">
          @if (loading()) { Ingresando... } @else { Iniciar sesión }
        </button>
      </form>
    </div>
  </div>
</div>
